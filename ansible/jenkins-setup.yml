---
# ansible/jenkins-setup.yml
# Usage: ansible-playbook -i inventory.ini jenkins-setup.yml

- name: Configure Jenkins server
  hosts: jenkins
  become: true
  vars:
    jenkins_plugins:
      - git
      - docker-workflow
      - kubernetes
      - pipeline
      - blueocean
      - credentials-binding
      - github
      - slack

  tasks:
    - name: Wait for Jenkins to start
      uri:
        url: "http://localhost:8080/login"
        status_code: 200
      register: result
      until: result.status == 200
      retries: 30
      delay: 10

    - name: Get Jenkins initial admin password
      slurp:
        src: /var/lib/jenkins/secrets/initialAdminPassword
      register: jenkins_password

    - name: Print initial admin password
      debug:
        msg: "Initial password: {{ jenkins_password.content | b64decode }}"

    - name: Install Jenkins plugins
      community.general.jenkins_plugin:
        name: "{{ item }}"
        url_username: admin
        url_password: "{{ jenkins_password.content | b64decode | trim }}"
        url: "http://localhost:8080"
        state: present
      loop: "{{ jenkins_plugins }}"

    - name: Restart Jenkins to activate plugins
      service:
        name: jenkins
        state: restarted

    - name: Configure Docker permissions for Jenkins
      user:
        name: jenkins
        groups: docker
        append: true

    - name: Install kubectl for Jenkins user
      get_url:
        url: "https://dl.k8s.io/release/{{ kubectl_version }}/bin/linux/amd64/kubectl"
        dest: /usr/local/bin/kubectl
        mode: '0755'
      vars:
        kubectl_version: "v1.28.0"
